<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Ai Giữ Rừng Dzậy?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #unity-canvas {
      display: block;
      background: #000;
      outline: none;
    }

    /* Thanh loading */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      font-size: 16px;
      z-index: 10;
    }
    #loading-bar {
      width: min(320px, 70vw);
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }
    #loading-fill {
      width: 0%;
      height: 100%;
      background: #7ed957;
      transition: width 0.2s;
    }

    /* Thông báo lỗi */
    #error-box {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      z-index: 20;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="loading">
    <div id="loading-status" role="status" aria-live="polite">Đang tải game...</div>
    <div id="loading-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loading-fill"></div></div>
  </div>

  <div id="error-box" role="alert"><div>
    <p id="error-message">Không tải được game. Hãy kiểm tra kết nối rồi thử lại.</p>
    <button id="retry" type="button" style="margin-top:20px;padding:12px 24px;font-size:16px;cursor:pointer">Thử lại</button>
  </div></div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.getElementById("loading");
    const loadingFill = document.getElementById("loading-fill");
    const errorBox = document.getElementById("error-box");
    const targetAspect = 16 / 9;
    let unityInstanceRef = null;

    const loadingStatus = document.getElementById("loading-status");
    const progressBar = document.getElementById("loading-bar");
    let failed = false;
    let lastProgressAt = performance.now();
    let lastProgress = 0;
    const loadStartedAt = performance.now();
    try { performance.mark("forest-load-start"); } catch (e) {}
    document.getElementById("retry").addEventListener("click", function () { window.location.reload(); });

    // Stable payload fingerprint also versions the loader and distinguishes gzip/Brotli variants.
    // No timestamps, storage deletion or per-visit cache invalidation.
    const BUILD_VERSION = "1e8541ca4cf2e21d67dfeb5130141119.data.unityweb|486c55ee911b5f74b2390818368a5c8f.wasm.unityweb|8e3024cc7aaa51b39a453e13e67944d5.framework.js.unityweb|Brotli";
    function buildUrl(path) { return "Build/" + path + "?v=" + encodeURIComponent(BUILD_VERSION); }
    function showError(err) {
      if (failed) return;
      failed = true;
      console.error("Unity initialization failed:", err);
      loading.style.display = "none";
      errorBox.style.display = "flex";
    }
    // Inform the player about slow progress without declaring a valid download failed.
    const statusTimer = setInterval(function () {
      if (failed || unityInstanceRef) { clearInterval(statusTimer); return; }
      if (!navigator.onLine) loadingStatus.textContent = "Mất kết nối mạng. Đang chờ kết nối trở lại...";
      else if (performance.now() - lastProgressAt > 15000)
        loadingStatus.textContent = "Đang tải hoặc khởi tạo game (" + Math.floor(lastProgress * 100) + "%). Lần đầu có thể lâu hơn, vui lòng chờ...";
    }, 2000);

    // 2. Co giãn canvas theo tỉ lệ 16:9, vừa khít màn hình
    function resizeCanvasToFitScreen() {
      const vp = window.visualViewport;
      const winW = vp ? vp.width : window.innerWidth;
      const winH = vp ? vp.height : window.innerHeight;

      let w, h;
      if (winW / winH > targetAspect) {
        h = winH;
        w = winH * targetAspect;
      } else {
        w = winW;
        h = winW / targetAspect;
      }

      canvas.style.width = Math.floor(w) + "px";
      canvas.style.height = Math.floor(h) + "px";
    }

    window.addEventListener("resize", resizeCanvasToFitScreen);
    window.addEventListener("orientationchange", function () {
      setTimeout(resizeCanvasToFitScreen, 100);
      setTimeout(resizeCanvasToFitScreen, 300);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", resizeCanvasToFitScreen);
    }
    resizeCanvasToFitScreen();

    // 3. Focus canvas ngay lần chạm/click đầu tiên
    window.addEventListener("pointerdown", function () { canvas.focus(); }, true);

    // 4. Tạm dừng / tiếp tục âm thanh khi ẩn tab, thoát ra màn hình chính
    function sendVisibility(state) {
      if (!unityInstanceRef) return;
      try {
        unityInstanceRef.SendMessage("AudioManager", "OnBrowserVisibility", state);
      } catch (e) {
        console.warn(e);
      }
    }

    document.addEventListener("visibilitychange", function () {
      sendVisibility(document.hidden ? "hidden" : "visible");
    });
    window.addEventListener("pagehide", function () { sendVisibility("hidden"); });

    // Quay lại từ bộ nhớ đệm back/forward (bfcache) trên điện thoại => tải lại trang mới
    window.addEventListener("pageshow", function (e) {
      if (e.persisted) {
        window.location.reload();
        return;
      }
      sendVisibility(document.hidden ? "hidden" : "visible");
    });

    // 5. Khởi tạo Unity WebGL
    function startUnity() {
      createUnityInstance(canvas, {
        dataUrl: buildUrl("1e8541ca4cf2e21d67dfeb5130141119.data.unityweb"),
        frameworkUrl: buildUrl("8e3024cc7aaa51b39a453e13e67944d5.framework.js.unityweb"),
        codeUrl: buildUrl("486c55ee911b5f74b2390818368a5c8f.wasm.unityweb"),
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ADayInForest",
        productVersion: "1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (message, type) {
          if (type === "error") showError(message);
          else console.warn(message);
        },
        // Only content-addressed Build files are immutable. StreamingAssets may retain their names.
        cacheControl: function (url) {
          return /\/Build\/[0-9a-f]{32}\./i.test(new URL(url, document.baseURI).pathname) ? "immutable" : "must-revalidate";
        }
      }, function (progress) {
        lastProgress = Math.max(0, Math.min(1, progress));
        lastProgressAt = performance.now();
        loadingFill.style.width = (lastProgress * 100) + "%";
        progressBar.setAttribute("aria-valuenow", Math.floor(lastProgress * 100));
        loadingStatus.textContent = (lastProgress >= 0.9 ? "Đang khởi tạo game... " : "Đang tải game... ") + Math.floor(lastProgress * 100) + "%";
      }).then(function (unityInstance) {
        unityInstanceRef = unityInstance;
        clearInterval(statusTimer);
        try {
          performance.mark("forest-unity-ready");
          performance.measure("forest-loading", "forest-load-start", "forest-unity-ready");
        } catch (e) {}
        console.info("Forest Unity ready (ms):", performance.now() - loadStartedAt);
        loading.style.display = "none";
        canvas.focus();
        resizeCanvasToFitScreen();
      }).catch(showError);
    }

    const script = document.createElement("script");
    script.src = buildUrl("cee3bfd5589651a8b16e2a12b8abe5b3.loader.js");
    script.onload = function () {
      try { startUnity(); } catch (err) { showError(err); }
    };
    script.onerror = function () { showError("Không tải được Unity loader. Kiểm tra kết nối hoặc phiên bản triển khai."); };
    document.body.appendChild(script);
  </script>
</body>
</html>
