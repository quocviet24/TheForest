<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Ai Giữ Rừng Dzậy?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #unity-canvas {
      display: block;
      background: #000;
      outline: none;
    }

    /* Thanh loading */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      font-size: 16px;
      z-index: 10;
    }
    #loading-bar {
      width: min(320px, 70vw);
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }
    #loading-fill {
      width: 0%;
      height: 100%;
      background: #7ed957;
      transition: width 0.2s;
    }

    /* Thông báo lỗi */
    #error-box {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      z-index: 20;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="loading">
    <div>Đang tải game...</div>
    <div id="loading-bar"><div id="loading-fill"></div></div>
  </div>

  <div id="error-box">Không tải được game. Vui lòng đóng tab và mở lại trang.</div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.getElementById("loading");
    const loadingFill = document.getElementById("loading-fill");
    const errorBox = document.getElementById("error-box");
    const targetAspect = 16 / 9;
    let unityInstanceRef = null;

    // Mã phiên bản: mỗi lần vào là một giá trị mới => luôn tải bản mới nhất
    const BUILD_VERSION = Date.now();
    const BUILD_NAME = "A-Day-In-The-Forest";
    function buildUrl(path) { return "Build/" + path + "?v=" + BUILD_VERSION; }

    function showError(err) {
      console.error(err);
      loading.style.display = "none";
      errorBox.style.display = "flex";
    }

    // 1. Dọn sạch cache cũ mỗi lần vào (không cần giữ bản cũ)
    function clearOldCaches() {
      const tasks = [];

      if ("serviceWorker" in navigator) {
        tasks.push(
          navigator.serviceWorker.getRegistrations()
            .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
            .catch(function () {})
        );
      }

      if ("caches" in window) {
        tasks.push(
          caches.keys()
            .then(function (names) { return Promise.all(names.map(function (n) { return caches.delete(n); })); })
            .catch(function () {})
        );
      }

      // Xóa cache IndexedDB cũ của Unity (nơi lưu file .data)
      try {
        ["UnityCache", "/idbfs"].forEach(function (db) {
          if (db === "UnityCache") indexedDB.deleteDatabase(db);
        });
      } catch (e) {}

      return Promise.all(tasks);
    }

    // 2. Co giãn canvas theo tỉ lệ 16:9, vừa khít màn hình
    function resizeCanvasToFitScreen() {
      const vp = window.visualViewport;
      const winW = vp ? vp.width : window.innerWidth;
      const winH = vp ? vp.height : window.innerHeight;

      let w, h;
      if (winW / winH > targetAspect) {
        h = winH;
        w = winH * targetAspect;
      } else {
        w = winW;
        h = winW / targetAspect;
      }

      canvas.style.width = Math.floor(w) + "px";
      canvas.style.height = Math.floor(h) + "px";
    }

    window.addEventListener("resize", resizeCanvasToFitScreen);
    window.addEventListener("orientationchange", function () {
      setTimeout(resizeCanvasToFitScreen, 100);
      setTimeout(resizeCanvasToFitScreen, 300);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", resizeCanvasToFitScreen);
    }
    resizeCanvasToFitScreen();

    // 3. Focus canvas ngay lần chạm/click đầu tiên
    window.addEventListener("pointerdown", function () { canvas.focus(); }, true);

    // 4. Tạm dừng / tiếp tục âm thanh khi ẩn tab, thoát ra màn hình chính
    function sendVisibility(state) {
      if (!unityInstanceRef) return;
      try {
        unityInstanceRef.SendMessage("AudioManager", "OnBrowserVisibility", state);
      } catch (e) {
        console.warn(e);
      }
    }

    document.addEventListener("visibilitychange", function () {
      sendVisibility(document.hidden ? "hidden" : "visible");
    });
    window.addEventListener("pagehide", function () { sendVisibility("hidden"); });

    // Quay lại từ bộ nhớ đệm back/forward (bfcache) trên điện thoại => tải lại trang mới
    window.addEventListener("pageshow", function (e) {
      if (e.persisted) {
        window.location.reload();
        return;
      }
      sendVisibility(document.hidden ? "hidden" : "visible");
    });

    // 5. Khởi tạo Unity WebGL
    function startUnity() {
      createUnityInstance(canvas, {
        dataUrl: buildUrl(BUILD_NAME + ".data.unityweb"),
        frameworkUrl: buildUrl(BUILD_NAME + ".framework.js.unityweb"),
        codeUrl: buildUrl(BUILD_NAME + ".wasm.unityweb"),
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ADayInForest",
        productVersion: "1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        // Không cho Unity lưu cache, luôn tải mới
        cacheControl: function (url) { return "no-store"; }
      }, function (progress) {
        loadingFill.style.width = (progress * 100) + "%";
      }).then(function (unityInstance) {
        unityInstanceRef = unityInstance;
        loading.style.display = "none";
        canvas.focus();
        resizeCanvasToFitScreen();
      }).catch(showError);
    }

    // 6. Dọn cache xong mới tải file loader (kèm mã phiên bản) rồi chạy game
    clearOldCaches().then(function () {
      const script = document.createElement("script");
      script.src = buildUrl(BUILD_NAME + ".loader.js");
      script.onload = startUnity;
      script.onerror = function () { showError("Không tải được loader.js"); };
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
