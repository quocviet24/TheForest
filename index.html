<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ai Giữ Rừng Dzậy?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #unity-canvas {
      display: block;
      background: #000;
      outline: none;
    }

    /* Thanh loading */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      font-size: 16px;
      z-index: 10;
    }
    #loading-bar {
      width: min(320px, 70vw);
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }
    #loading-fill {
      width: 0%;
      height: 100%;
      background: #7ed957;
      transition: width 0.2s;
    }

    /* Thông báo lỗi */
    #error-box {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      z-index: 20;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="loading">
    <div>Đang tải game...</div>
    <div id="loading-bar"><div id="loading-fill"></div></div>
  </div>

  <div id="error-box">Không tải được game. Vui lòng tải lại trang (Ctrl + F5).</div>

  <script src="Build/A-Day-In-The-Forest.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.getElementById("loading");
    const loadingFill = document.getElementById("loading-fill");
    const errorBox = document.getElementById("error-box");
    const targetAspect = 16 / 9;

    // 1. Gỡ ServiceWorker cũ (nếu có)
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
    }

    // 2. Co giãn canvas theo tỉ lệ 16:9, vừa khít màn hình
    function resizeCanvasToFitScreen() {
      const vp = window.visualViewport;
      const winW = vp ? vp.width : window.innerWidth;
      const winH = vp ? vp.height : window.innerHeight;

      let w, h;
      if (winW / winH > targetAspect) {
        h = winH;
        w = winH * targetAspect;
      } else {
        w = winW;
        h = winW / targetAspect;
      }

      canvas.style.width = Math.floor(w) + "px";
      canvas.style.height = Math.floor(h) + "px";
    }

    window.addEventListener("resize", resizeCanvasToFitScreen);
    window.addEventListener("orientationchange", function () {
      setTimeout(resizeCanvasToFitScreen, 100);
      setTimeout(resizeCanvasToFitScreen, 300);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", resizeCanvasToFitScreen);
    }
    resizeCanvasToFitScreen();

    // 3. Focus canvas ngay lần chạm/click đầu tiên
    window.addEventListener("pointerdown", function () { canvas.focus(); }, true);

    // 4. Khởi tạo Unity WebGL
    createUnityInstance(canvas, {
      dataUrl: "Build/A-Day-In-The-Forest.data.unityweb",
      frameworkUrl: "Build/A-Day-In-The-Forest.framework.js.unityweb",
      codeUrl: "Build/A-Day-In-The-Forest.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "ADayInForest",
      productVersion: "1.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    }, function (progress) {
      loadingFill.style.width = (progress * 100) + "%";
    }).then(function () {
      loading.style.display = "none";
      canvas.focus();
      resizeCanvasToFitScreen();
    }).catch(function (message) {
      console.error(message);
      loading.style.display = "none";
      errorBox.style.display = "flex";
    });
  </script>
</body>
</html>
